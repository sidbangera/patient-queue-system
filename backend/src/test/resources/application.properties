# Local context test uses the already-migrated, synthetic PostgreSQL database.
# Supply DB_PASSWORD in the terminal; never commit a real password here.
jwt.secret=test_only_32_byte_secret_change_in_real_deployments_0123456789
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/patient_queue}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=never
app.clinic-zone=${CLINIC_ZONE:Asia/Kolkata}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*}
